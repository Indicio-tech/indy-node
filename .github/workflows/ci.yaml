name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'Dockerfile'
      - 'Dockerfile.base'
      - '.github/**'
      - 'bump_version.sh'

  workflow_dispatch:
    inputs:
      plenum_base_image:
        description: 'Plenum base image (e.g. ghcr.io/owner/indy-plenum-base:tag)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-22.04
    outputs:
      base_image: ${{ steps.vars.outputs.base_image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$EVENT_NAME" = "pull_request" ]; then
            tag="pr-${PR_NUMBER}-$(echo "$COMMIT_SHA" | head -c 7)"
          else
            tag="sha-$(echo "$COMMIT_SHA" | head -c 12)"
          fi
          echo "owner=${owner}" >> $GITHUB_OUTPUT
          echo "base_image_tag=ghcr.io/${owner}/indy-node-base:${tag}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve plenum base image
        id: plenum
        env:
          OWNER: ${{ steps.vars.outputs.owner }}
        run: |
          if [ -n "${{ inputs.plenum_base_image }}" ]; then
            echo "image=${{ inputs.plenum_base_image }}" >> $GITHUB_OUTPUT
          else
            echo "image=ghcr.io/${OWNER}/indy-plenum-base:latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ${{ steps.vars.outputs.base_image_tag }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/indy-node-base:latest', steps.vars.outputs.owner) || '' }}
          build-args: PLENUM_BASE_IMAGE=${{ steps.plenum.outputs.image }}
          cache-from: type=gha,scope=pr-${{ github.event.pull_request.number || 'main' }}
          cache-to: type=gha,mode=max,scope=pr-${{ github.event.pull_request.number || 'main' }}

  build:
    name: Build Production Image
    needs: [build-base]
    runs-on: ubuntu-22.04
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$EVENT_NAME" = "pull_request" ]; then
            tag="pr-${PR_NUMBER}-$(echo "$COMMIT_SHA" | head -c 7)"
          else
            tag="sha-$(echo "$COMMIT_SHA" | head -c 12)"
          fi
          echo "owner=${owner}" >> $GITHUB_OUTPUT
          echo "image_tag=ghcr.io/${owner}/indy-node:${tag}" >> $GITHUB_OUTPUT

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_tag }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/indy-node:latest', steps.vars.outputs.owner) || '' }}
          build-args: BASE_IMAGE=${{ needs.build-base.outputs.base_image }}
          cache-from: type=gha,scope=pr-${{ github.event.pull_request.number || 'main' }}
          cache-to: type=gha,mode=max,scope=pr-${{ github.event.pull_request.number || 'main' }}

      - name: Set image tag output
        id: image
        run: echo "image_tag=${{ steps.vars.outputs.image_tag }}" >> $GITHUB_OUTPUT

  test:
    name: Test Node
    needs: [build]
    uses: ./.github/workflows/reuseable_test.yaml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
