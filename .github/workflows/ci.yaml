name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'Dockerfile'
      - 'Dockerfile.base'
      - '.github/**'
      - 'bump_version.sh'

  workflow_dispatch:
    inputs:
      plenum_base_image:
        description: 'Plenum base image (e.g. ghcr.io/owner/indy-plenum-base:tag)'
        required: false
        default: ''

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> $GITHUB_OUTPUT

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve plenum base image
        id: plenum
        env:
          OWNER: ${{ steps.vars.outputs.owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If user specified an override via workflow_dispatch, use it
          if [ -n "${{ inputs.plenum_base_image }}" ]; then
            echo "image=${{ inputs.plenum_base_image }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check fork owner's GHCR first, then fall back to hyperledger
          for ns in "${OWNER}" "hyperledger"; do
            if curl -sf -H "Authorization: Bearer ${GHCR_TOKEN}" \
                 "https://ghcr.io/v2/${ns}/indy-plenum-base/manifests/latest" \
                 -H "Accept: application/vnd.oci.image.index.v1+json" >/dev/null 2>&1; then
              echo "image=ghcr.io/${ns}/indy-plenum-base:latest" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "image=ghcr.io/hyperledger/indy-plenum-base:latest" >> $GITHUB_OUTPUT

      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/indy-node-base:latest
          build-args: PLENUM_BASE_IMAGE=${{ steps.plenum.outputs.image }}

  build:
    name: Build Production Image
    needs: [build-base]
    runs-on: ubuntu-22.04
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/indy-node:latest
          build-args: BASE_IMAGE=ghcr.io/${{ steps.vars.outputs.owner }}/indy-node-base:latest

      - name: Set image tag output
        id: image
        run: echo "image_tag=ghcr.io/${{ steps.vars.outputs.owner }}/indy-node:latest" >> $GITHUB_OUTPUT

  test:
    name: Test Node
    needs: [build]
    uses: ./.github/workflows/reuseable_test.yaml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
