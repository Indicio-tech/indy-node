name: Repo Dispatched Update Plenum Dependency

on:
  repository_dispatch:
    types: [update-node]

env:
  BASE_IMAGE: ghcr.io/hyperledger/indy-node-base
  PROD_IMAGE: ghcr.io/hyperledger/indy-node

jobs:
  rebuild-docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          build-args: |
            PLENUM_BASE_IMAGE=ghcr.io/hyperledger/indy-plenum-base:${{ github.event.client_payload.dockerTag }}
          tags: ${{ env.BASE_IMAGE }}:latest

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.PROD_IMAGE }}:latest
