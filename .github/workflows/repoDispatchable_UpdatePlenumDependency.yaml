name: Repo Dispatched Update Plenum Dependency

on:
  repository_dispatch:
    types: [update-node]

jobs:
  rebuild-docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "plenum_owner=$(echo '${{ github.event.client_payload.dockerOwner || 'hyperledger' }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          build-args: |
            PLENUM_BASE_IMAGE=ghcr.io/${{ steps.vars.outputs.plenum_owner }}/indy-plenum-base:${{ github.event.client_payload.dockerTag }}
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/indy-node-base:latest

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: BASE_IMAGE=ghcr.io/${{ steps.vars.outputs.owner }}/indy-node-base:latest
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/indy-node:latest
