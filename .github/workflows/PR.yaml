name: Indy Node - PR Workflow
on:
  pull_request:
    paths:
      - '**'
      - "!indy_node/__version__.json"

    branches:
      - main

  workflow_dispatch:

env:
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/indy-node-base
  PROD_IMAGE: ghcr.io/${{ github.repository_owner }}/indy-node

jobs:
  testsNeeded:
    name: Check if tests needed
    runs-on: ubuntu-latest
    outputs:
      testsNeeded: ${{ steps.filter.outputs.testsNeeded }}
    steps:
      - uses: actions/checkout@v4
      - name: testsNeeded
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            testsNeeded:
              - '**.py'
              - '.github/**'
              - 'Dockerfile'
              - 'Dockerfile.base'
              - 'bump_version.sh'

  docker-build-base:
    name: Build Base Image
    needs: [testsNeeded]
    if: ${{ needs.testsNeeded.outputs.testsNeeded == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          load: true
          tags: ${{ env.BASE_IMAGE }}:latest

  docker-build:
    name: Build Production Image
    needs: [testsNeeded, docker-build-base]
    if: ${{ needs.testsNeeded.outputs.testsNeeded == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.PROD_IMAGE }}:latest

  indy_node_tests:
    name: Indy Node Tests
    needs: [testsNeeded, docker-build]
    if: ${{ needs.testsNeeded.outputs.testsNeeded == 'true' }}
    uses: ./.github/workflows/reuseable_test.yaml
    with:
      image_tag: ${{ env.PROD_IMAGE }}:latest

  statusCheck:
    name: statusCheck
    runs-on: ubuntu-latest
    needs: [testsNeeded, indy_node_tests]
    if: ${{ needs.testsNeeded.outputs.testsNeeded == 'false' || success() }}
    steps:
      - run: 'echo "Just a status Check (Always true, when executed) for branch protection rules(blocks merging while test are running and if tests fail)." '
