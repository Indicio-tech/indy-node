name: Triggered by Version Bump Release PR

on:
  pull_request:
    paths:
      - '!**'
      - "indy_node/__version__.json"

env:
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/indy-node-base
  PROD_IMAGE: ghcr.io/${{ github.repository_owner }}/indy-node

jobs:
  release-infos:
    name: infos
    runs-on: ubuntu-latest
    outputs:
      isVersionBump: ${{ steps.get-release-info.outputs.isVersionBump }}
      isPreRelease: ${{ steps.get-release-info.outputs.isRC }}
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      - name: get-release-info
        id: get-release-info
        shell: bash
        run: |
          version=$(grep -oP "\d+.\d+.\d+((-|.)?rc\d+)?" <<< "${{ github.event.pull_request.body }}" || true)
          if [[ ! -z ${version} ]]; then
            versionTag="v${version}"
            if [[ "${version}" == *'rc'* ]]; then
              isRC=true
              component="rc"
              prBranch=update-rc-version
            else
              isRC=false
              component="stable"
              prBranch=update-version
            fi
            if [[ $(grep -oP "\[v\d+.\d+.\d+(-?rc\d+)?\]" <<< "${{ github.event.pull_request.body }}" || true) ]]; then
              isVersionBump=true
            else
              isVersionBump=false
            fi
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "versionTag=${versionTag}" >> $GITHUB_OUTPUT
          echo "isRC=${isRC}" >> $GITHUB_OUTPUT
          echo "component=${component}" >> $GITHUB_OUTPUT
          echo "prBranch=${prBranch}" >> $GITHUB_OUTPUT
          echo "isVersionBump=${isVersionBump}" >> $GITHUB_OUTPUT

  docker-build-base:
    name: Build Base Image
    needs: [release-infos]
    if: needs.release-infos.outputs.isVersionBump == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          load: true
          tags: ${{ env.BASE_IMAGE }}:latest

  docker-build:
    name: Build Production Image
    needs: [release-infos, docker-build-base]
    if: needs.release-infos.outputs.isVersionBump == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.PROD_IMAGE }}:latest

  indy_node_tests:
    name: Indy Node Tests
    needs: [release-infos, docker-build]
    if: needs.release-infos.outputs.isVersionBump == 'true'
    uses: ./.github/workflows/reuseable_test.yaml
    with:
      image_tag: ${{ env.PROD_IMAGE }}:latest

  statusCheck:
    name: statusCheck
    runs-on: ubuntu-latest
    needs: [indy_node_tests]
    steps:
      - run: 'echo "Just a status Check (Always true, when executed) for branch protection rules(blocks merging while test are running and if tests fail)." '
