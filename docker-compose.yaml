services:
  indy-node:
    image: ghcr.io/hyperledger/indy-node:latest
    ports:
      - "${NODE_IP}:${NODE_PORT}:${NODE_PORT}"
      - "${CLIENT_IP}:${CLIENT_PORT}:${CLIENT_PORT}"
    volumes:
      - indy-data:/var/lib/indy
      - indy-config:/etc/indy
      - indy-logs:/var/log/indy
    environment:
      - NODE_NAME=
      - NODE_IP=${NODE_IP}
      - NODE_PORT=${NODE_PORT}
      - CLIENT_IP=${CLIENT_IP}
      - CLIENT_PORT=${CLIENT_PORT}
      - NETWORK_NAME=sandbox
      - BIND_IP=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,json; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',30003)); s.sendall(json.dumps({'command':'health'}).encode()); r=json.loads(s.recv(4096)); s.close(); exit(0 if r.get('status')=='ok' else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  indy-data:
  indy-config:
  indy-logs:
